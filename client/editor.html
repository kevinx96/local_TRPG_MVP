<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scenario Editor</title>
    <link rel="stylesheet" href="/static/editor.css?v=20260810-combat-engine" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>Scenario Editor</strong>
        <span id="dirtyBadge" class="dirty-badge">saved</span>
      </div>
      <div class="filebar">
        <select id="scenarioSelect" aria-label="选择剧本"></select>
        <input id="filenameInput" type="text" spellcheck="false" aria-label="文件名" />
        <button id="newButton" type="button">新建</button>
        <button id="duplicateButton" type="button">复制</button>
        <button id="saveButton" type="button" class="primary">保存</button>
      </div>
      <div class="topbar-right">
        <div id="statusText" class="status">loading</div>
        <button id="shutdownButton" type="button" class="shutdown-btn" title="远程关闭 Ollama 机器">⏻ 关机 Ollama</button>
      </div>
    </header>

    <main class="editor-shell">
      <nav class="section-nav" aria-label="编辑区">
        <button data-section="meta" type="button">基本信息</button>
        <button data-section="rules" type="button">规则</button>
        <button data-section="scenes" type="button">场景</button>
        <button data-section="hybrid" type="button">Hybrid</button>
        <button data-section="locations" type="button">地点</button>
        <button data-section="npcs" type="button">NPC</button>
        <button data-section="items" type="button">道具</button>
        <button data-section="clues" type="button">线索</button>
        <button data-section="enemies" type="button">敌人</button>
        <button data-section="attribute_defs" type="button">属性定义</button>
        <button data-section="characters" type="button">角色</button>
        <button data-section="combat_rules" type="button">战斗规则</button>
        <button data-section="fallback" type="button">全局选项</button>
        <button data-section="combat" type="button">战斗选项</button>
        <button data-section="json" type="button">JSON</button>
      </nav>

      <section class="record-list">
        <div class="list-head">
          <h1 id="listTitle">场景</h1>
          <button id="addRecordButton" type="button">添加</button>
        </div>
        <div id="recordList" class="records"></div>
      </section>

      <section id="editorPane" class="editor-pane" aria-live="polite"></section>
    </main>

    <script src="/static/editor.js?v=20260810-combat-engine"></script>
    <script>
      (function () {
        const btn = document.getElementById('shutdownButton');
        if (!btn) return;
        btn.addEventListener('click', async () => {
          const ok = confirm(
            '⚠️ 确定要远程关闭 Ollama 机器吗？\n\n'
            + '该电脑将在 30 秒后关机，\n'
            + '可以在 Ollama 机器上运行 "shutdown /a" 来取消。'
          );
          if (!ok) return;
          btn.disabled = true;
          btn.textContent = '⏳ 关机中…';
          try {
            const res = await fetch('/api/ollama/shutdown', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
            });
            const data = await res.json();
            if (res.ok) {
              btn.textContent = '✅ ' + data.message;
            } else {
              alert('关机失败: ' + (data.detail || res.statusText));
              btn.textContent = '⏻ 关机 Ollama';
              btn.disabled = false;
            }
          } catch (err) {
            alert('请求失败: ' + err.message);
            btn.textContent = '⏻ 关机 Ollama';
            btn.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
