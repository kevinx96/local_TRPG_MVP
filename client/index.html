<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local TRPG — 冒険の書</title>
    <meta name="description" content="ローカルLLMで動くテーブルトークRPG。没入感ある物語体験。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>

    <!-- ═══════ START SCREEN ═══════ -->
    <div id="startScreen" class="start-screen">
      <div class="start-bg"></div>
      <div class="start-content">
        <div class="start-sigil">
          <svg viewBox="0 0 120 120" width="120" height="120" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="60" cy="60" r="56" opacity=".4"/>
            <circle cx="60" cy="60" r="42" opacity=".25"/>
            <polygon points="60,12 68,44 100,44 74,62 82,94 60,76 38,94 46,62 20,44 52,44" opacity=".6"/>
          </svg>
        </div>
        <h1 class="start-title">LOCAL TRPG</h1>
        <p class="start-subtitle">ローカルLLMが紡ぐ、あなただけの冒険</p>
        <div class="start-form">
          <label for="heroNameInput" class="start-label">勇者の名前</label>
          <input id="heroNameInput" type="text" class="start-input" value="アルス" placeholder="名前を入力..." maxlength="20" />
          
          <label class="start-label">勇者の性別</label>
          <div class="start-gender-select" style="display: flex; gap: 15px; color: var(--text);">
            <label style="cursor: pointer;"><input type="radio" name="heroGender" value="男勇者" checked> 男</label>
            <label style="cursor: pointer;"><input type="radio" name="heroGender" value="女勇者"> 女</label>
          </div>

          <button id="startButton" type="button" class="start-btn">
            <span class="start-btn-text">冒険を始める</span>
            <span class="start-btn-loading" style="display:none">物語を紡いでいます…</span>
          </button>
        </div>
        <p id="backendStatus" class="start-backend">接続確認中…</p>
      </div>

      <!-- Config Panel -->
      <div class="config-panel" id="configPanel">
        <button type="button" class="config-toggle" id="configToggle" aria-label="Model settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
        <div class="config-dropdown" id="configDropdown">
          <div class="config-field">
            <label class="config-label" for="backendSelect">Backend</label>
            <select id="backendSelect" class="config-select">
              <option value="ollama">Ollama</option>
            </select>
          </div>
          <div class="config-field">
            <label class="config-label" for="modelSelect">Model</label>
            <select id="modelSelect" class="config-select">
              <option value="qwen2.5-7b-instruct-local">qwen2.5-7b-instruct-local</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- ═══════ GAME SCREEN (GALGAME LAYOUT) ═══════ -->
    <main id="gameScreen" class="galgame-shell" style="display:none">
      <!-- Background Layer -->
      <div id="background" class="gal-bg"></div>

      <!-- Sprite Layer -->
      <div id="spriteLayer" class="gal-sprite-layer">
        <img id="portrait" class="gal-sprite" src="" style="display:none;" />
      </div>

      <!-- Top Overlay -->
      <div class="gal-top-overlay">
        <div class="scene-info">
          <p class="eyebrow">現在の場面</p>
          <h1 id="sceneTitle">開始準備</h1>
        </div>
        <button id="menuToggleBtn" type="button" class="gal-icon-btn">MENU</button>
      </div>

      <!-- Choices -->
      <div id="choicesArea" class="gal-choices-area" style="display:none">
        <div id="choicesList" class="choices-list"></div>
      </div>

      <!-- Bottom UI Area -->
      <div class="gal-bottom-area">

        <!-- Dialogue Box -->
        <div id="dialogueBox" class="gal-dialogue-box" role="button" tabindex="0">
          <div id="speakerName" class="gal-speaker">GM</div>
          <div id="messageText" class="gal-message-text"></div>
          <div id="clickIndicator" class="gal-click-indicator">▼</div>
        </div>

        <!-- Input Form -->
        <form id="turnForm" class="gal-turn-form" style="display:none;">
          <textarea id="playerInput" rows="1" placeholder="自分で行動を入力…"></textarea>
          <button id="sendButton" type="submit">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2L11 13"/>
              <path d="M22 2L15 22L11 13L2 9L22 2Z"/>
            </svg>
          </button>
        </form>

        <!-- Bottom Menu Bar -->
        <div class="gal-menu-bar">
          <button id="logToggleBtn" type="button" class="gal-menu-btn">LOG</button>
          <button id="inputToggleBtn" type="button" class="gal-menu-btn">入力</button>
          <button id="newSessionButton" type="button" class="gal-menu-btn">新規</button>
          <span id="backendInfo" class="backend-info-sm">設定確認中</span>
        </div>
      </div>

      <!-- Overlays (Hidden by default) -->
      <!-- Backlog Overlay -->
      <div id="logOverlay" class="gal-overlay" style="display:none">
        <div class="gal-overlay-header">
          <h2>BACKLOG</h2>
          <button id="logCloseBtn" type="button" class="gal-close-btn">×</button>
        </div>
        <div id="messages" class="messages" aria-live="polite"></div>
      </div>

      <!-- System/Character Menu Overlay -->
      <div id="menuOverlay" class="gal-overlay" style="display:none">
        <div class="gal-overlay-header">
          <h2>SYSTEM MENU</h2>
          <button id="menuCloseBtn" type="button" class="gal-close-btn">×</button>
        </div>
        <div class="gal-menu-content">
          <aside class="sidebar">
            <h2 id="characterName" class="char-name-display">アルス</h2>
            <p id="characterDescription">世界を救うため旅立つ若き勇者。</p>
            <div class="meters">
              <div class="meter-row"><span class="meter-label">HP</span><div class="meter hp-meter"><i id="hpBar"></i></div><strong id="hpText">20/20</strong></div>
              <div class="meter-row"><span class="meter-label">MP</span><div class="meter mp-meter"><i id="mpBar"></i></div><strong id="mpText">8/8</strong></div>
              <div class="meter-row"><span class="meter-label">SP</span><div class="meter sp-meter"><i id="spBar"></i></div><strong id="spText">10/10</strong></div>
            </div>
            <div class="gold-row"><span class="gold-label">GOLD</span><strong id="goldText">0</strong></div>
            <h3>所持品</h3><ul id="inventory" class="inventory"></ul>
            <h3>最近の判定</h3><ul id="diceLog" class="dice-log"></ul>
          </aside>
          <aside class="system-panel">
            <h2>システムログ</h2><ul id="systemLogs"></ul>
          </aside>
        </div>
      </div>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
